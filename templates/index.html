<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Fiction Engine</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕰️</text></svg>">
    <style>
        body {
            background-color: #0a0a0c;
            color: #d1d1d1;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            padding: 2rem;
            margin: 0;
        }
        #game-container {
            width: 100%;
            max-width: 800px;
            background: #141417;
            padding: 2.5rem;
            border-radius: 6px;
            border: 1px solid #2a2a35;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 { 
            color: #d4af37; 
            text-align: center; 
            border-bottom: 1px solid #2a2a35; 
            padding-bottom: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #inventory-panel { color: #9d81d2; font-size: 0.95rem; margin-bottom: 2rem; text-align: right; }
        #story-text { font-size: 1.15rem; line-height: 1.7; margin-bottom: 2rem; }
        .choice-btn {
            display: block; width: 100%; background: #1c1c21; color: #d1d1d1;
            border: 1px solid #2a2a35; padding: 1.2rem; margin-bottom: 0.8rem;
            text-align: left; cursor: pointer; border-radius: 4px; font-family: inherit;
            font-size: 1rem; transition: all 0.2s ease;
        }
        .choice-btn:hover { background: #2a2a35; border-color: #d4af37; color: #ffffff; }
        .restart-btn { text-align: center; color: #d4af37; font-weight: bold; font-size: 1.1rem; }
        
        #chat-section { margin-top: 2rem; border-top: 1px solid #2a2a35; padding-top: 1rem; }
        #chat-input {
            width: calc(100% - 24px); padding: 12px; background: #0a0a0c; 
            color: #d1d1d1; border: 1px solid #2a2a35; border-radius: 4px; font-family: inherit;
        }
        #chat-input:focus { outline: none; border-color: #d4af37; }
        #ai-response { color: #62a0ea; margin-top: 1rem; font-style: italic; }
        #error-msg { color: #e06c75; margin-top: 1rem; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <h1>Midnight Clocktower</h1>
    <div id="inventory-panel">Inventory: <span id="inventory-list">Empty</span></div>
    
    <div id="story-text">Loading...</div>
    <div id="choices-container"></div>
    <div id="error-msg"></div>

    <div id="chat-section">
        <p style="color: #6c6c75; font-size: 0.9rem;">Talk to the Narrator:</p>
        <input type="text" id="chat-input" placeholder="Ask a question and press Enter..." autocomplete="off">
        <div id="ai-response"></div>
    </div>
</div>

<script>
    async function loadState() {
        const res = await fetch('/api/state');
        const data = await res.json();
        
        document.getElementById('story-text').innerText = data.text;
        document.getElementById('inventory-list').innerText = data.inventory.length > 0 ? data.inventory.join(', ') : 'Empty';
        document.getElementById('error-msg').innerText = '';
        document.getElementById('ai-response').innerText = '';
        
        const choicesDiv = document.getElementById('choices-container');
        choicesDiv.innerHTML = '';
        
        if (data.choices.length === 0) {
            // Reached an ending: Inject Game Over UI & Play Again Button
            choicesDiv.innerHTML = `
                <p style="text-align: center; color: #e06c75; font-size: 1.2rem; margin: 2rem 0; letter-spacing: 2px;">--- THE END ---</p>
                <button class="choice-btn restart-btn" onclick="restartGame()">Play Again</button>
            `;
            document.getElementById('chat-section').style.display = 'none'; // Hide chat at the end
        } else {
            document.getElementById('chat-section').style.display = 'block'; // Show chat during gameplay
            data.choices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                let btnText = `${index + 1}. ${choice.choice_text}`;
                if (choice.required_item) btnText += ` 🔒 [Requires: ${choice.required_item}]`;
                btn.innerText = btnText;
                btn.onclick = () => makeChoice(index);
                choicesDiv.appendChild(btn);
            });
        }
    }

    async function makeChoice(index) {
        const res = await fetch('/api/choice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ choice_idx: index })
        });
        const data = await res.json();
        
        if (data.status === 'locked') {
            document.getElementById('error-msg').innerText = "🔒 " + data.message;
        } else if (data.status === 'success') {
            loadState();
        }
    }

    async function restartGame() {
        await fetch('/api/reset', { method: 'POST' });
        document.getElementById('chat-input').value = '';
        loadState();
    }

    document.getElementById('chat-input').addEventListener('keypress', async function (e) {
        if (e.key === 'Enter' && this.value.trim() !== '') {
            const userInput = this.value;
            this.value = '';
            document.getElementById('ai-response').innerText = "[Analyzing your words...]";
            
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: userInput })
            });
            const data = await res.json();
            document.getElementById('ai-response').innerText = "🤖 Narrator: " + data.response;
        }
    });

    // Start game
    loadState();
</script>
</body>
</html>
